[project]
name = "raven-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "cua-sandbox>=0.9.1; python_version < '3.14'",
    "hai-agents[cli,desktop]>=1.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
raven-core = "raven_core:main"

[tool.uv]
constraint-dependencies = ["hai-drivers<0.1.17", "soupsieve<4"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
