# XcodeGen spec (optional). The committed RavenMobile.xcodeproj was hand-written and
# uses a file-system-synchronized group, so new files under RavenMobile/ are picked up
# automatically. Regenerate with `xcodegen generate` only if you prefer XcodeGen.
name: RavenMobile
options:
  bundleIdPrefix: ai.raven
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  RavenMobile:
    type: application
    platform: iOS
    sources:
      - path: RavenMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.raven.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Raven
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  RavenMobile:
    build:
      targets:
        RavenMobile: all
    run:
      config: Debug
